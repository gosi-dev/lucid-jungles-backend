<!DOCTYPE html>
<html lang="en" style="background: #f4f4f4;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email - Lucid Jungles</title>
  <style>
    body {
      background: #f4f4f4;
      font-family: 'Avenir', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 480px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: #1a7f5a;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }
    h1 {
      font-size: 1.5rem;
      color: #222;
      margin-bottom: 8px;
    }
    p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 24px;
    }
    .verify-btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(90deg, #1a7f5a 0%, #3ecf8e 100%);
      color: #fff;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.1rem;
      letter-spacing: 1px;
      margin-bottom: 24px;
      transition: background 0.2s;
    }
    .verify-btn:hover {
      background: linear-gradient(90deg, #3ecf8e 0%, #1a7f5a 100%);
    }
    .footer {
      color: #aaa;
      font-size: 0.9rem;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Lucid Jungles</div>
    <h1>Welcome, {{USER_NAME}}!</h1>
    <p>Thank you for joining Lucid Jungles.<br>
    Please verify your email address to activate your account and start exploring.</p>
    <a href="{{VERIFICATION_LINK}}" class="verify-btn">Verify Email</a>
    <div class="footer">
      &copy; Lucid Jungles, All rights reserved.<br>
      If you did not sign up for this account, you can safely ignore this email.
    </div>
  </div>
</body>
</html>
